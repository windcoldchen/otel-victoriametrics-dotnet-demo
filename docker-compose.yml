networks:
  obs-demo-net:
    driver: bridge

volumes:
  vm_data:
  vlogs_data:
  vtraces_data:
  grafana_data:
  valkey_data:
  kafka_data:
  opensearch_data:
  postgres_data:

services:
  # 1. .NET 10 Web API 業務微服務
  order-service:
    build:
      context: .
      dockerfile: src/OrderService/Dockerfile
    container_name: order-service
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=OrderService
      - ConnectionStrings__PostgreSQL=Host=postgres;Port=5432;Database=orderdb;Username=postgres;Password=postgres;
      - ConnectionStrings__Valkey=valkey:6379
      - ConnectionStrings__Kafka=kafka:29092
      - ConnectionStrings__OpenSearch=http://opensearch:9200
    depends_on:
      - otel-collector
      - valkey
      - kafka
      - opensearch
      - postgres
    networks:
      - obs-demo-net

  # 2. OpenTelemetry 收集與分流中樞
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8888:8888" # Collector 自身指標
    depends_on:
      - victoria-metrics
      - victoria-logs
      - victoria-traces
      - valkey
      - kafka
      - opensearch
      - postgres
    networks:
      - obs-demo-net

  # 3. VictoriaMetrics (時序指標 TSDB)
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.106.0
    container_name: victoria-metrics
    ports:
      - "8428:8428"
    volumes:
      - vm_data:/victoria-metrics-data
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-httpListenAddr=:8428"
      - "-retentionPeriod=7d"
    networks:
      - obs-demo-net

  # 4. VictoriaLogs (結構化日誌 TSDB)
  victoria-logs:
    image: victoriametrics/victoria-logs:v1.53.0
    container_name: victoria-logs
    ports:
      - "9428:9428"
    volumes:
      - vlogs_data:/victoria-logs-data
    command:
      - "-storageDataPath=/victoria-logs-data"
      - "-httpListenAddr=:9428"
      - "-retentionPeriod=7d"
    networks:
      - obs-demo-net

  # 5. VictoriaTraces (分散式鏈路追蹤 TSDB)
  victoria-traces:
    image: victoriametrics/victoria-traces:v0.1.0
    container_name: victoria-traces
    ports:
      - "10428:10428"
    volumes:
      - vtraces_data:/victoria-traces-data
    command:
      - "-storageDataPath=/victoria-traces-data"
      - "-httpListenAddr=:10428"
      - "-retentionPeriod=3d"
    networks:
      - obs-demo-net

  # 6. Grafana (統一視覺化平台)
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=victoriametrics-datasource,victorialogs-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - victoria-metrics
      - victoria-logs
      - victoria-traces
    networks:
      - obs-demo-net

  # 7. Valkey 9 (高速記憶體快取，相容 Redis 協定)
  valkey:
    image: valkey/valkey:9-alpine
    container_name: valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: ["valkey-server", "--appendonly", "yes"]
    networks:
      - obs-demo-net

  # 8. Apache Kafka 3.9 (KRaft 模式事件串流)
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - obs-demo-net

  # 9. OpenSearch 3 (分散式搜尋與分析引擎)
  opensearch:
    image: opensearchproject/opensearch:3
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - obs-demo-net

  # 10. PostgreSQL (關聯式交易資料庫)
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      - POSTGRES_DB=orderdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    command:
      - "postgres"
      - "-c"
      - "log_destination=stderr"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "log_duration=on"
      - "-c"
      - "log_line_prefix=%m [%p] %q%u@%d "
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - obs-demo-net

  # 11. Vector (容器日誌收集器：自動即時收集所有容器日誌並發送至 VictoriaLogs)
  vector:
    image: timberio/vector:0.43.0-alpine
    container_name: vector
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - victoria-logs
    networks:
      - obs-demo-net
