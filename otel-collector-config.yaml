receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # 1. Valkey 9 (Redis 協定) 指標收集器
  redis:
    endpoint: "valkey:6379"
    collection_interval: 10s

  # 2. PostgreSQL 指標收集器 (連線數、Rollbacks、Deadlocks、Block Reads)
  postgresql:
    endpoint: "postgres:5432"
    transport: tcp
    username: postgres
    password: postgres
    databases:
      - orderdb
    collection_interval: 10s
    tls:
      insecure: true

  # 3. Apache Kafka 3.9 指標收集器 (Broker、Topics、Partitions 與 Consumer Group Lag)
  kafka_metrics:
    brokers:
      - "kafka:29092"
    protocol_version: "3.0.0"
    collection_interval: 10s
    scrapers:
      - brokers
      - topics
      - consumers

  # 4. OpenSearch 3 指標收集器 (Cluster Health、Shards、JVM、Indexing/Search 延遲)
  elasticsearch:
    endpoint: "http://opensearch:9200"
    collection_interval: 10s

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  batch:
    timeout: 2s
    send_batch_size: 1024

exporters:
  # 1. Metrics -> VictoriaMetrics
  prometheusremotewrite:
    endpoint: "http://victoria-metrics:8428/api/v1/write"
    resource_to_telemetry_conversion:
      enabled: true

  # 2. Logs -> VictoriaLogs
  otlphttp/victorialogs:
    endpoint: "http://victoria-logs:9428/insert/opentelemetry"
    tls:
      insecure: true

  # 3. Traces -> VictoriaTraces
  otlp/victoriatraces:
    endpoint: "victoria-traces:10428"
    tls:
      insecure: true

  # Debug logging exporter (optional, prints to container stdout)
  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info
  pipelines:
    metrics:
      receivers: [otlp, redis, postgresql, kafka_metrics, elasticsearch]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite, debug]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/victorialogs, debug]

    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/victoriatraces, debug]
